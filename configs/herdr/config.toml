onboarding = false

[theme]
name = "one-dark"
auto_switch = false

[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
prompt_new_tab_name = false

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "$now_playing_status", fg = "#89b4fa", dim = true }],
  [{ token = "$now_playing_title", fg = "#89b4fa", dim = true }],
  [{ token = "$now_playing_artist", fg = "#89b4fa", dim = true }],
]

[ui.toast]
delivery = "herdr"

[keys]
prefix = "ctrl+a"

split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

new_workspace = "prefix+w"
previous_workspace = "shift+up"
next_workspace = "shift+down"

previous_agent = "shift+alt+up"
next_agent = "shift+alt+down"

new_worktree = ["prefix+n", "prefix+g"]
open_worktree = "prefix+o"
open_notification_target = "prefix+shift+o"

previous_tab = "shift+left"
next_tab = "shift+right"

goto = "prefix+shift+g"

[[keys.command]]
key = "prefix+shift+i"
type = "popup"
command = "$HERDR_BIN_PATH plugin install natori-hrj/herdr-lazy"
description = "install herdr-lazy"

[[keys.command]]
key = "prefix+shift+u"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "herdr-lazy: manage plugins"

[[keys.command]]
key = ["cmd+r", "prefix+ctrl+r"]
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "herdr-reviewr: toggle reviewer"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[[keys.command]]
key = "prefix+;"
type = "plugin_action"
command = "spywhere.now-playing.previous"
description = "now-playing: previous"

[[keys.command]]
key = "prefix+'"
type = "plugin_action"
command = "spywhere.now-playing.next"
description = "now-playing: next"

[[keys.command]]
key = "prefix+comma"
type = "plugin_action"
command = "spywhere.now-playing.playpause"
description = "now-playing: play/pause"

[[keys.command]]
key = "prefix+."
type = "plugin_action"
command = "spywhere.now-playing.stop"
description = "now-playing: stop"
