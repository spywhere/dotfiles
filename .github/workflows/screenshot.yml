name: Setup Screenshot

# Renders .github/screenshot/preview.png from the real dotfiles configs
# (install the packages, run the setup, capture the actual herdr/nvim
# session) -- README.md embeds this file directly. On a pull_request it
# also posts the freshly rendered image to the PR description for review
# before it merges, and runs on every push to the PR branch with no extra
# throttling. push on main covers commits that land there outside a PR,
# so the README image can't go stale -- but main is gated to at most once
# a day (see the `gate` job) since it's just keeping the README in sync,
# not something under active review.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Check run policy
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether to run
        id: decide
        run: |
          # Only push (i.e. main, per the trigger above) is throttled --
          # pull_request/workflow_dispatch always run, since those are
          # actively being reviewed and should reflect every push.
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=$(git log -1 --format=%cI -- .github/screenshot/preview.png)
          if [ -z "$last" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_epoch=$(date -d "$last" +%s)
          now_epoch=$(date -u +%s)
          if [ $(( now_epoch - last_epoch )) -ge 86400 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  screenshot:
    name: Capture setup screenshot
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # pull_request defaults to checking out the synthetic merge ref
          # in detached HEAD, which isn't a fast-forward of the real branch
          # and makes the later `git push` back to the branch fail.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Perform Installation
        run: |
          # Skip everything package-wise except herdr, the nerd font and
          # opencode (for the agent pane demo) -- no screenshot in this job
          # shows a GUI app, so there's no need for the rest of the catalog
          # (casks, App Store apps, etc). Still runs setup/config.sh to link
          # all the configs. starship is a "custom" (non-brew, curl-installed)
          # install, so it's kept -- panes should show the real prompt.
          sh install.sh --profile=ci -y \
            no-app-store no-ssh no-version-manager \
            no-package herdr fonts opencode

      - name: Install screenshot-only tooling
        run: |
          # neovim, tty-clock and fastfetch are not part of this repo's
          # package catalog (nvim is bring-your-own, the clock/fetch panes
          # are demo-only) -- vhs drives the terminal for capture. fastfetch
          # is neofetch's actively maintained successor (neofetch itself was
          # dropped from homebrew-core after being archived upstream).
          # lua-language-server is required for the LSP demo: configs/nvim's
          # lua_ls setup only attaches if the binary is already on PATH, it
          # doesn't auto-install via mason. tree-sitter (the CLI) is needed
          # too -- configs/nvim always tries to install ~20 parsers on
          # startup, and without the CLI those fail with a blocking
          # "Press ENTER to continue" prompt that eats later keystrokes.
          brew install neovim tty-clock fastfetch vhs lua-language-server tree-sitter

      - name: Seed experiment flags
        run: |
          # tmux=a disables zshrc's auto-launch race (it starts herdr/tmux
          # while zinit is still finishing its first-run plugin bootstrap,
          # which is unpredictably slow on a fresh CI shell); the tape drives
          # `herdr` explicitly instead once the shell is confirmed ready.
          printf 'tmux=a\n' > ~/.explist

      - name: Bootstrap nvim plugins
        run: |
          # TSUpdateSync blocks until treesitter parser installs finish --
          # without it, those jobs would just get killed at +qa (headless
          # nvim exiting doesn't let background jobs "finish later"), and
          # the interactive session would hit the same failure again.
          nvim --headless "+Lazy! sync" -c "TSUpdateSync" +qa

      - name: Render setup preview
        run: |
          vhs .github/screenshot/dotfiles.tape

      - name: Commit preview screenshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/screenshot/preview.png
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(ci): update setup screenshot preview"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update PR description
        if: steps.commit.outputs.changed == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = { start: '<!-- setup-screenshot:start -->', end: '<!-- setup-screenshot:end -->' };
            const imageUrl = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${context.payload.pull_request.head.ref}/.github/screenshot/preview.png?t=${context.sha}`;
            const section = `${marker.start}\n### Setup Preview (generated)\n![Setup Preview](${imageUrl})\n${marker.end}`;

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const body = pr.body || '';
            const pattern = new RegExp(`${marker.start}[\\s\\S]*?${marker.end}`);
            const nextBody = pattern.test(body)
              ? body.replace(pattern, section)
              : `${body}\n\n${section}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: nextBody
            });
