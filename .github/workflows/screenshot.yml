name: Setup Screenshot & Demo

# Renders .github/demo.gif from the real dotfiles configs (install the
# packages, run the setup, record the actual herdr/nvim session) and
# commits it back to the branch, where README.md embeds it directly. The
# tape can also freeze a still screenshot from the same take; that's
# currently off, since the README carries just the demo. Runs on every
# push to a PR with no extra throttling. push on main covers commits that
# land there outside a PR, so the README can't go stale -- but main is
# gated to at most once a day (see the `gate` job) since it's just keeping
# the README in sync, not something under active review.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Check run policy
    runs-on: ubuntu-latest
    # The commit job below pushes straight back to the PR branch, which
    # re-fires this workflow's own pull_request trigger for a commit that
    # can't produce anything new (it's the render this very run just made).
    # That redundant run was showing up stuck on "action_required" instead
    # of just completing, so skip it outright instead of re-running (and
    # re-approving) the whole macOS job for no reason.
    if: github.actor != 'github-actions[bot]'
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether to run
        id: decide
        run: |
          # Only push (i.e. main, per the trigger above) is throttled --
          # pull_request/workflow_dispatch always run, since those are
          # actively being reviewed and should reflect every push.
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Keyed off the demo, since that's what this workflow renders --
          # .github/screenshot.png is no longer regenerated, so its commit
          # date would freeze and this throttle would never hold.
          last=$(git log -1 --format=%cI -- .github/demo.gif)
          if [ -z "$last" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_epoch=$(date -d "$last" +%s)
          now_epoch=$(date -u +%s)
          if [ $(( now_epoch - last_epoch )) -ge 86400 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  screenshot:
    name: Capture setup screenshot & demo
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # pull_request defaults to checking out the synthetic merge ref
          # in detached HEAD, which isn't a fast-forward of the real branch
          # and makes the later `git push` back to the branch fail.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Perform Installation
        run: |
          # Run against this checkout instead of a fresh clone. install.sh
          # resolves both the installer and every config source through
          # $HOME/.dots (INSTALLER_DIR, and _sh_cmd in systems/base.sh),
          # and clones the repo's *default branch* into it when that
          # directory is missing. So on a PR the screenshot was rendering
          # main's configs while opening this checkout's files -- a config
          # change on the branch could not affect the capture at all.
          # Pointing .dots at the workspace makes it the single source of
          # truth; --local then refuses to fall back to cloning, so this
          # fails loudly rather than silently reverting to main.
          ln -s "$GITHUB_WORKSPACE" "$HOME/.dots"

          # Skip everything package-wise except herdr, the nerd font and
          # opencode (for the agent pane demo) -- no screenshot in this job
          # shows a GUI app, so there's no need for the rest of the catalog
          # (casks, App Store apps, etc). Still runs setup/config.sh to link
          # all the configs. starship is a "custom" (non-brew, curl-installed)
          # install, so it's kept -- panes should show the real prompt.
          sh install.sh --profile=ci -y --local \
            no-app-store no-ssh no-version-manager \
            no-package herdr fonts opencode

      - name: Verify configs are linked from this checkout
        run: |
          # Guards the failure mode that made this job silently useless for
          # reviewing config changes: when install.sh falls back to cloning
          # $HOME/.dots itself, every linked config comes from the default
          # branch and the capture stops reflecting the PR. That is not
          # visible in the screenshot -- it just quietly shows the wrong
          # tree -- so assert it here instead of trusting it.
          resolved="$(readlink -f "$HOME/.config/nvim")"
          echo "~/.config/nvim -> $resolved"
          case "$resolved" in
            "$GITHUB_WORKSPACE"/*)
              echo "OK: linked from this checkout"
              ;;
            *)
              echo "::error::~/.config/nvim resolves to $resolved, outside $GITHUB_WORKSPACE -- install.sh cloned its own copy, so the screenshot would render that tree instead of this branch"
              exit 1
              ;;
          esac

      - name: Install screenshot-only tooling
        run: |
          # neovim, tty-clock and fastfetch are not part of this repo's
          # package catalog (nvim is bring-your-own, the clock/fetch panes
          # are demo-only) -- vhs drives the terminal for capture. fastfetch
          # is neofetch's actively maintained successor (neofetch itself was
          # dropped from homebrew-core after being archived upstream).
          # lua-language-server is required for the LSP demo: configs/nvim's
          # lua_ls setup only attaches if the binary is already on PATH, it
          # doesn't auto-install via mason. The tree-sitter CLI is needed
          # too -- configs/nvim always tries to install ~20 parsers on
          # startup, and without it those fail with a blocking "Press ENTER
          # to continue" prompt that eats later keystrokes. `brew install
          # tree-sitter` only pulls in libtree-sitter (the runtime library)
          # -- the CLI is a separate formula, tree-sitter-cli (confirmed via
          # a CI run where every single parser failed identically with
          # "ENOENT: no such file or directory (cmd): 'tree-sitter'").
          # fzf is needed for the tape's <C-p> file-finder step -- fzf-lua
          # shells out to the real fzf binary, which this repo
          # normally installs via mise (setup/version-manager.sh), but this
          # job passes no-version-manager to install.sh, so it's otherwise
          # missing here. Without it, <C-p> errors out and every keystroke
          # meant for the picker's search box lands as raw keys in whatever
          # nvim buffer is focused instead. fd and ripgrep are fzf-lua's
          # file-listing/grep backends (normally installed as regular
          # packages -- packages/fd.sh, packages/ripgrep.sh -- but this job
          # passes no-package too); without either, the files picker opens
          # with an empty result list instead of erroring, since fzf-lua
          # has no further fallback once both are missing.
          brew install neovim tty-clock fastfetch vhs lua-language-server tree-sitter-cli fzf fd ripgrep

      - name: Seed experiment flags
        run: |
          # tmux=a disables zshrc's auto-launch race (it starts herdr/tmux
          # while zinit is still finishing its first-run plugin bootstrap,
          # which is unpredictably slow on a fresh CI shell); the tape drives
          # `herdr` explicitly instead once the shell is confirmed ready.
          #
          # no_wakatime=b skips vim-wakatime. There's no wakatime-cli or
          # ~/.wakatime.cfg on a fresh runner, so it prints "API Key not
          # found" on buffer changes; enough of those stack into a blocking
          # "Press ENTER or type command to continue" prompt, and from there
          # each scripted keystroke is spent dismissing the prompt instead
          # of doing its job -- which is exactly what derailed the recording
          # before, since the demo flow crosses far more buffers than the
          # plain screenshot flow did.
          printf 'tmux=a\nno_wakatime=b\n' > ~/.explist

      - name: Write the priming script
        run: |
          # Everything the priming session does, in one script it runs
          # itself -- no keystrokes are typed at that nvim (see
          # supports/screenshot/prime.tape for why that matters now that
          # the plugin download happens there too).
          #
          # Three phases: wait for lazy to finish installing plugins, open
          # a lua buffer to bring the LSP path (and so mason) to life, then
          # wait for treesitter's parsers and mason's servers to settle and
          # quit, so the recording afterwards starts against an idle
          # editor.
          #
          # Fixed paths because a vhs tape cannot read the environment.
          cat > /tmp/nvim-prime.lua <<'LUA'
          local uv = vim.uv or vim.loop
          local out = '/tmp/nvim-prime-result.txt'
          local logfile = '/tmp/nvim-prime-log.txt'

          local waited, phase_waited = 0, 0
          local phase = 'plugins'

          -- Keep the message area roomy for the whole session. A hit-enter
          -- prompt blocks this timer -- nothing scheduled runs while nvim
          -- sits in vgetc() -- and there are no keystrokes coming to
          -- dismiss one, so the session would hang until the tape's Wait
          -- gives up. The tape's --cmd covers messages emitted during
          -- init; this covers the rest of the session, and is reasserted
          -- every tick because configs/nvim sets cmdheight to 0 or 1 in
          -- its own startup pass (editor/appearance.lua) and plug.nvim
          -- defers part of that well past the point --cmd applies.
          local function keep_room ()
            if vim.o.cmdheight < 5 then vim.o.cmdheight = 5 end
            vim.o.more = false
            vim.opt.shortmess:append('F')
          end
          keep_room()

          local function note (line)
            local f = io.open(logfile, 'a')
            if not f then return end
            f:write(('[%4ds %s] %s\n'):format(waited, phase, line))
            f:close()
          end

          -- have/want over lazy's own resolved spec, so this counts what
          -- this config actually asks for rather than a hardcoded number.
          -- -1/-1 means lazy isn't up yet (plug.nvim curls itself down and
          -- bootstraps the backend on a cold machine, so that's the normal
          -- reading for the first few polls, not an error).
          local function plugins ()
            local ok, cfg = pcall(require, 'lazy.core.config')
            if not ok or type(cfg.plugins) ~= 'table' then return -1, -1 end
            local want, have = 0, 0
            for _, p in pairs(cfg.plugins) do
              want = want + 1
              if p.dir and uv.fs_stat(p.dir) then have = have + 1 end
            end
            return have, want
          end

          local function parsers ()
            local ok, cfg = pcall(require, 'nvim-treesitter.config')
            if not ok then return {} end
            local ok2, list = pcall(cfg.get_installed)
            return ok2 and list or {}
          end

          local function mason ()
            local ok, reg = pcall(require, 'mason-registry')
            if not ok then return -1 end
            local ok2, names = pcall(function ()
              return reg.get_installed_package_names()
            end)
            if ok2 and names then return #names end
            return -1
          end

          -- Where lazy actually puts plugins. plug.nvim leaves the backend
          -- root at lazy's own default, so the workflow has nothing to
          -- hardcode -- it reads this back instead of guessing. (const.lua
          -- defines a plugin_home global, but nothing wires it to the lazy
          -- backend; asserting against it found an empty directory while
          -- all 84 plugins were installed and working.)
          local function root ()
            local ok, cfg = pcall(require, 'lazy.core.config')
            if not ok then return '?' end
            if type(cfg.options) == 'table' and cfg.options.root then
              return cfg.options.root
            end
            if type(cfg.plugins) == 'table' then
              for _, p in pairs(cfg.plugins) do
                if p.dir then return (p.dir:gsub('/[^/]+$', '')) end
              end
            end
            return '?'
          end

          local function finish (why)
            local have, want = plugins()
            local f = io.open(out, 'w')
            f:write((
              'plugins=%d/%d parsers=%d mason=%d waited=%ds phase=%s ' ..
              'reason=%s root=%s\n'
            ):format(have, want, #parsers(), mason(), waited, phase, why, root()))
            f:write(table.concat(parsers(), ' ') .. '\n')
            f:close()
            note('finish: ' .. why)
            vim.cmd('qa!')
          end

          local last, stable = '', 0
          local function enter (next_phase)
            note('-> ' .. next_phase)
            phase = next_phase
            phase_waited = 0
            last, stable = '', 0
          end

          -- Through stdpath rather than a path relative to the shell's cwd:
          -- ~/.config/nvim is the symlink install.sh laid down into this
          -- checkout, so this resolves to the branch's own lsp.lua wherever
          -- the session happens to start.
          local function open_lua_buffer ()
            local path = vim.fn.stdpath('config') .. '/lua/lib/lsp.lua'
            local ok, err = pcall(vim.cmd.edit, path)
            note(('edit %s -> %s'):format(path, ok and 'ok' or tostring(err)))
          end

          local timer = uv.new_timer()
          timer:start(3000, 3000, vim.schedule_wrap(function ()
            waited = waited + 3
            phase_waited = phase_waited + 3
            keep_room()

            if phase == 'plugins' then
              local have, want = plugins()
              local sig = ('%d/%d'):format(have, want)
              if sig == last then stable = stable + 1 else stable = 0 end
              if stable == 0 then note('plugins ' .. sig) end
              last = sig

              -- Every plugin in the spec has a directory, and that has held
              -- for ~9s. The dwell matters because lazy clones straight
              -- into the target directory, so a directory appearing is not
              -- by itself proof the clone finished -- but a count that has
              -- stopped moving while every entry is present is.
              if want > 0 and have == want and stable >= 3 then
                enter('lsp')
                open_lua_buffer()
                enter('settle')
              elseif phase_waited >= 600 then
                timer:stop()
                finish('plugin-timeout')
              end
              return
            end

            local np, nm = #parsers(), mason()
            local sig = ('%d/%d'):format(np, nm)
            if sig == last then stable = stable + 1 else stable = 0 end
            if stable == 0 then note('parsers/mason ' .. sig) end
            last = sig
            -- Settle only once both counts hold steady for ~45s, and never
            -- before 120s in this phase: mason downloads nine servers over
            -- the network, so an early lull says nothing about being
            -- finished.
            --
            -- Both counts must also be non-zero. "Flat" is trivially true
            -- before anything has started, which is how the first run of
            -- this quit at exactly 120s -- the floor, to the second --
            -- with nothing installed: it had been flat at 0/0 the whole
            -- time and was only ever waiting out the clock. Requiring
            -- progress means a setup that genuinely installs nothing runs
            -- into the timeout below and reports it, instead of passing
            -- quietly.
            if stable >= 15 and phase_waited >= 120 and np > 0 and nm > 0 then
              timer:stop()
              finish('settled')
            elseif phase_waited >= 660 then
              timer:stop()
              finish('timeout')
            end
          end))
          LUA

      - name: Prime the setup in a real terminal
        timeout-minutes: 30
        run: |
          # Do the whole first-run work once, for real, before recording
          # anything -- plugin download included. This is the only cold
          # start in the job.
          #
          # It has to be a terminal session rather than `nvim --headless`:
          # mason simply does not install headlessly. A bootstrap that
          # opened a lua buffer and waited 90s reported "mason=0 opened=lua"
          # with an empty package directory, and the servers then installed
          # themselves during the take instead -- which is what kept
          # starving the first fzf picker while the second one, running
          # after mason had finished, worked fine.
          #
          # Patching the config to skip mason in CI was the alternative, and
          # was rejected on purpose: the demo should show the real setup, so
          # CI pays the real setup cost instead of documenting a different
          # one. Only the demo-only tooling stays CI-specific.

          # Force a genuinely clean install -- install.sh links this
          # checkout, but nvim's data dirs are not assumed to be pristine.
          # This covers the plugins too: plug.nvim leaves lazy's root at
          # its default under ~/.local/share/nvim. (const.lua defines a
          # plugin_home global pointing at configs/nvim/plugged, but
          # nothing wires it to the lazy backend, so clearing it does
          # nothing. Unused is not the same as deletable, though -- the
          # demo's closing shot completes onto that global, so const.lua
          # keeps it.)
          rm -rf ~/.local/share/nvim ~/.local/state/nvim ~/.cache/nvim

          # Don't let vhs's exit code decide this step. What matters here
          # is the side effect on disk, not the throwaway recording -- and
          # vhs fails the whole invocation for reasons that say nothing
          # about priming ("no frames" if the trailing Sleep is too short
          # for the framerate, which is precisely how the first run of this
          # died *after* priming had run fine, and took the diagnostics
          # below down with it).
          vhs supports/screenshot/prime.tape || vhs_status=$?

          echo "--- priming result ---"
          cat /tmp/nvim-prime-result.txt || echo "(no result written)"
          echo "--- priming log ---"
          cat /tmp/nvim-prime-log.txt || echo "(no log written)"
          echo "--- installed plugins ---"
          lazy_root="$(sed -n 's/.*root=\([^ ]*\).*/\1/p' /tmp/nvim-prime-result.txt 2>/dev/null | head -1)"
          echo "root: ${lazy_root:-(unknown)}"
          ls "$lazy_root" 2>/dev/null | wc -l
          echo "--- mason packages on disk ---"
          ls ~/.local/share/nvim/mason/packages 2>/dev/null | tr '\n' ' ' || true
          echo
          echo "--- compiled parser objects ---"
          find ~/.local/share/nvim -name '*.so' -path '*parser*' 2>/dev/null | wc -l

          # Fail loudly rather than recording a demo that will starve. The
          # log above is what says *where* it stalled -- it's the only
          # record, now that a plugin-download failure surfaces as a
          # timing-out session rather than a nonzero exit from
          # `nvim --headless "+Lazy! sync"`.
          #
          # The script is the authority on whether the setup is ready, so
          # assert on what it reported rather than on paths guessed out
          # here -- reason=settled is only reachable once every plugin in
          # lazy's spec is on disk *and* the parser and mason counts have
          # both moved off zero and held steady. An earlier version of this
          # counted files in a directory instead and failed a run in which
          # everything had in fact installed correctly.
          prime_line="$(head -1 /tmp/nvim-prime-result.txt 2>/dev/null || true)"
          case "$prime_line" in
            *reason=settled*)
              echo "OK: $prime_line"
              ;;
            *)
              echo "::error::priming did not settle -- ${prime_line:-no result written}. See the priming log above for the phase it stalled in."
              exit 1
              ;;
          esac

          if [ -z "$(ls -A ~/.local/share/nvim/mason/packages 2>/dev/null)" ]; then
            echo "::error::mason installed nothing during priming, so the recording would do it on camera and starve the take"
            exit 1
          fi

          if [ -n "${vhs_status:-}" ]; then
            echo "::warning::vhs exited ${vhs_status} on the priming tape, but the setup primed -- continuing"
          fi

      - name: Render setup demo & screenshot
        run: |
          # One tape, one herdr/nvim session. Driving two tapes/vhs
          # invocations in the same job used to reattach to the same herdr
          # server (it's a persistent multiplexer -- panes and the previous
          # tape's nvim session stay alive across a detach), feeding the
          # second tape's keystrokes into leftover state from the first.
          vhs supports/screenshot/dotfiles.tape

      - name: Commit preview demo
        uses: EndBug/add-and-commit@v10
        with:
          add: .github/demo.gif
          default_author: github_actions
          message: "chore(ci): update setup demo preview"
